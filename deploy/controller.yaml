apiVersion: v1
kind: ServiceAccount
metadata:
  name: azure-external-lb-controller
  namespace: kube-system
  # For workload identity, add your platform's federated client ID annotation here.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: azure-external-lb-controller
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: azure-external-lb-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: azure-external-lb-controller
subjects:
  - kind: ServiceAccount
    name: azure-external-lb-controller
    namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-external-lb-controller
  namespace: kube-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: azure-external-lb-controller
  template:
    metadata:
      labels:
        app: azure-external-lb-controller
        # Add your platform's workload identity injection label if required.
    spec:
      serviceAccountName: azure-external-lb-controller
      containers:
        - name: controller
          image: YOUR_REGISTRY/azure-external-lb-controller:YOUR_TAG
          env:
            - name: AZURE_SUBSCRIPTION_ID
              value: YOUR_SUBSCRIPTION_ID
            - name: AZURE_RESOURCE_GROUP
              value: YOUR_RESOURCE_GROUP
            - name: AZURE_LOAD_BALANCER
              value: YOUR_LOAD_BALANCER
            - name: AZURE_BACKEND_POOL
              value: YOUR_BACKEND_POOL
            - name: AZURE_VNET_RESOURCE_ID
              value: YOUR_VNET_RESOURCE_ID
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault
